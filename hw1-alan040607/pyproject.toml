[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vyshkat"
version = "1.0.0"
description = "Консольный учёт парка ВышКат: SOLID, DI и тесты поведения"
requires-python = ">=3.12"
dependencies = ["dependency-injector>=4.48,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
vyshkat = "vyshkat.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=vyshkat --cov-report=term-missing --cov-fail-under=60"

[tool.coverage.run]
branch = true
source = ["vyshkat"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
